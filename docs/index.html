<style>
@font-face{font-family:"Schibsted Grotesk";src:url(sg.woff2) format("woff2");font-weight:450 800;font-style:normal;font-display:swap}
:root{
  --paper:#f7f5fa;--card:#fff;--tint:#ece8f3;--ink:#24133a;--ink2:#5d5170;--ink3:#8b819b;
  --line:#e3dded;--tag:#f2b21b;--tag-ink:#24133a;--cta:#24133a;--cta-ink:#fff;--cta-hover:#3a2358;
  --ok:#2f6b4a;--bad:#a23b3b;--ring:#7a4fd0;
  --r:14px;--font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#150c24;--card:#20133a;--tint:#2b1c4a;--ink:#f3eefb;--ink2:#b9aed0;--ink3:#8a7fa3;
  --line:#35275a;--cta:#f2b21b;--cta-ink:#24133a;--cta-hover:#ffc43d;--ok:#7fd1a2;--bad:#ff8f8f;--ring:#b79bff}}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:450 16px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-size:1.45rem;font-weight:800;letter-spacing:-.03em}
.brand b i{font-style:normal;font-weight:500}
.right{display:flex;align-items:center;gap:8px}
.lang{display:flex;background:var(--tint);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:5px 11px;border-radius:999px;font-weight:700;font-size:.82rem;cursor:pointer;color:var(--ink2)}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.wa-top{display:inline-flex;align-items:center;gap:7px;text-decoration:none;background:var(--cta);color:var(--cta-ink);padding:8px 14px;border-radius:999px;font-weight:700;font-size:.88rem}
.wa-top:hover{background:var(--cta-hover)}
.wa-top svg,.wa svg,.fab svg,.go svg{width:17px;height:17px;fill:currentColor;flex:none}
/* intro */
.intro{padding:18px 0 6px}
.intro h1{font-size:clamp(1.9rem,5.4vw,3.1rem);line-height:1.02;font-weight:800;letter-spacing:-.04em;max-width:16ch}
.intro p{margin-top:10px;color:var(--ink2);max-width:52ch}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:.88rem;font-weight:600;color:var(--ink2)}
.facts span{display:inline-flex;align-items:center;gap:6px}
.facts svg{width:15px;height:15px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* tools */
.tools{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);padding:10px 0 8px;margin-top:12px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;height:44px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:0 38px 0 14px}
.search input::placeholder{color:var(--ink3)}
.search input:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 30%,transparent)}
.x{position:absolute;right:6px;top:7px;width:30px;height:30px;border:0;background:none;font-size:1.3rem;cursor:pointer;color:var(--ink3)}
.sort{height:44px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:0 8px;max-width:42%}
.toggles{display:flex;gap:16px;margin-top:8px;font-size:.88rem;font-weight:600;color:var(--ink2)}
.toggles label{display:flex;align-items:center;gap:7px;cursor:pointer}
.toggles input{width:17px;height:17px;accent-color:var(--ink)}
.chips{display:flex;gap:7px;overflow-x:auto;margin-top:9px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-weight:650;font-size:.86rem;cursor:pointer;color:var(--ink2);white-space:nowrap}
.chip small{font-size:.74rem;font-weight:600;margin-left:5px;color:var(--ink3)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip[aria-pressed=true] small{color:var(--paper);opacity:.7}
.meta{display:flex;justify-content:space-between;gap:12px;padding:14px 0 10px;font-size:.84rem;color:var(--ink2)}
.meta strong{color:var(--ink)}
/* grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-bottom:96px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;width:100%}
.card:hover{border-color:var(--ink3)}
.pic{position:relative;aspect-ratio:4/3;background:var(--tint)}
.pic img{position:relative;width:100%;height:100%;object-fit:cover;display:block}
.pic.ph,.dpic.ph{background:#fff}
.pic.ph img,.dpic.ph img{object-fit:contain;background:#fff}
.pic i{position:absolute;inset:0;display:grid;place-items:center;font:800 1.4rem var(--font);color:var(--ink3);font-style:normal}
.tag{position:absolute;left:0;bottom:10px;background:var(--tag);color:var(--tag-ink);font-weight:800;font-size:1.02rem;letter-spacing:-.02em;padding:5px 12px 5px 20px;clip-path:polygon(0 50%,11px 0,100% 0,100% 100%,11px 100%);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag small{font-size:.68rem;font-weight:700;margin-left:3px;letter-spacing:0}
.tag.rq{background:var(--card);color:var(--ink);font-size:.8rem;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--ink)}
.flag{position:absolute;top:8px;right:8px;background:var(--ink);color:var(--paper);font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:999px}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.cat{font-size:.74rem;font-weight:650;color:var(--ink3)}
.title{font-size:.95rem;font-weight:700;line-height:1.25;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.out .pic img{filter:grayscale(1) opacity(.55)}
.card.out .title{color:var(--ink3)}
.card.out .tag{background:var(--ink3);color:var(--paper)}
.empty{text-align:center;padding:48px 0;color:var(--ink2)}
.empty h3{color:var(--ink);font-size:1.1rem}
.empty button{margin-top:12px;border:0;background:var(--cta);color:var(--cta-ink);padding:9px 16px;border-radius:999px;font-weight:700;cursor:pointer}
.err{background:var(--card);border:1.5px solid var(--bad);border-radius:var(--r);padding:16px;margin:14px 0}
/* floating whatsapp */
.fab{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:6;display:inline-flex;align-items:center;gap:8px;background:var(--cta);color:var(--cta-ink);text-decoration:none;font-weight:800;padding:13px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(36,19,58,.28)}
.fab:hover{background:var(--cta-hover)}
@media(max-width:699px){.fab{padding:14px}.fab span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.fab svg{width:24px;height:24px}}
/* detail sheet */
dialog{border:0;padding:0;background:var(--card);color:var(--ink);width:min(520px,100%);max-height:92vh;border-radius:20px 20px 0 0;margin:auto auto 0;overflow:auto}
dialog::backdrop{background:rgba(21,12,36,.62)}
@media(min-width:700px){dialog{border-radius:20px;margin:auto}}
dialog[open]{animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(prefers-reduced-motion:reduce){dialog[open]{animation:none}}
.dpic{position:relative;aspect-ratio:4/3;background:var(--tint)}
.dpic img{width:100%;height:100%;object-fit:cover;display:block}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(36,19,58,.78);color:#fff;font-size:1.3rem;line-height:1;cursor:pointer}
.nav.prev{left:8px}.nav.next{right:8px}.nav[hidden],.dots[hidden]{display:none}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(36,19,58,.35)}.dots i.on{background:#24133a;box-shadow:0 0 0 1.5px #fff}
.cap{position:absolute;left:10px;top:10px;background:rgba(36,19,58,.82);color:#fff;font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:999px}
.close{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font-size:1.4rem;cursor:pointer;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.dbody{padding:16px 18px 20px}
.dbody .cat{font-size:.8rem}
.dbody h2{font-size:1.35rem;line-height:1.2;letter-spacing:-.02em;margin:3px 0 8px}
.dprice{display:flex;align-items:center;gap:10px;margin:10px 0 12px;flex-wrap:wrap}
.dprice .tag{position:static;font-size:1.3rem;padding:7px 16px 7px 24px}
.stock{font-size:.84rem;font-weight:700;color:var(--ok)}
.stock.no{color:var(--bad)}
.dbody p{color:var(--ink2);max-width:60ch}
.ref{font-size:.78rem;color:var(--ink3);margin-top:10px}
.go{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:16px;background:var(--cta);color:var(--cta-ink);text-decoration:none;font-weight:800;padding:14px;border-radius:12px}
.go:hover{background:var(--cta-hover)}
.go2{display:block;text-align:center;margin-top:8px;padding:11px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;font-size:.92rem;text-decoration:none;color:var(--ink)}
.go2:hover{border-color:var(--ink)}
.go2[hidden]{display:none}
.go.off{background:var(--tint);color:var(--ink3);pointer-events:none}
/* cart */
.cartb{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink)}
.cartb:hover{border-color:var(--ink)}
.cartb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cartb b{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--tag);color:var(--tag-ink);font-size:.72rem;font-weight:800;display:grid;place-items:center}
.cartb b[hidden]{display:none}
@media(max-width:430px){.bar{gap:6px}.right{gap:6px}.brand b{font-size:1.3rem}.brand svg{width:30px;height:30px}.lang button{padding:5px 9px}.wa-top{padding:9px 13px}}
@media(max-width:380px){.brand b{font-size:1.15rem}.brand{gap:6px}.brand svg{width:26px;height:26px}.lang button{padding:4px 7px;font-size:.78rem}.cartb{width:34px;height:34px}.wa-top{padding:8px 11px;font-size:.82rem;gap:5px}.wa-top svg{width:15px;height:15px}}
@media(max-width:335px){.brand b{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
button.go,button.go2{width:100%;cursor:pointer;font-size:1rem}
button.go{border:0}
button.go2{background:none;color:var(--ink);font-size:.92rem}
button[hidden],.go[hidden]{display:none}
#cart{width:min(560px,100%)}
.chead{position:sticky;top:0;z-index:2;background:var(--card);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.chead h2{font-size:1.25rem;letter-spacing:-.02em}
.chead .close{position:static;flex:none}
.cbody{padding:6px 18px 22px}
.clist{list-style:none;padding:0}
.clist li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.clist .ct{font-weight:700;line-height:1.25}
.clist .cr{font-size:.76rem;color:var(--ink3)}
.clist .cp{font-weight:800;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.qty{display:inline-flex;align-items:center;gap:2px;margin-top:6px}
.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:1.15rem;line-height:1;cursor:pointer}
.qty button:hover{border-color:var(--ink)}
.qty span{min-width:30px;text-align:center;font-weight:800}
.rm{align-self:end;justify-self:end;border:0;background:none;color:var(--ink2);text-decoration:underline;font-size:.82rem;cursor:pointer;padding:6px 0}
.ctotal{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 0 4px;font-size:1.05rem}
.ctotal strong{font-size:1.4rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cnote{font-size:.8rem;color:var(--ink2);margin:2px 0 6px}
#c-form label,#c-form legend{display:block;font-weight:700;font-size:.88rem;margin-top:14px}
#c-form input[type=text],#c-form input[type=tel]{display:block;width:100%;height:44px;margin-top:5px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px;font-weight:450}
#c-form input:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 30%,transparent)}
#c-form fieldset{border:0;padding:0;min-width:0}
.pay{display:flex;align-items:center;gap:10px;margin-top:8px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;font-weight:650;font-size:.95rem;cursor:pointer;background:var(--card)}
#c-form .pay{margin-top:8px;font-size:.95rem}
.pay input{width:18px;height:18px;accent-color:var(--ink);flex:none}
.pay:has(input:checked){border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.paynote{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--tint);font-size:.86rem}
.cerr{margin-top:12px;color:var(--bad);font-weight:700;font-size:.9rem}
.priv{font-size:.76rem;color:var(--ink3);margin-top:10px}
.cempty{text-align:center;padding:36px 0;color:var(--ink2)}
.done{text-align:center;padding-top:18px}
.done .on{display:inline-block;margin:10px 0 6px;padding:8px 18px;border-radius:12px;background:var(--tint);font:800 1.5rem var(--font);letter-spacing:.02em;user-select:all}
.done p{color:var(--ink2);max-width:46ch;margin:8px auto}
#cart [hidden]{display:none!important}
.foot{padding:0 0 110px;font-size:.8rem;color:var(--ink3)}
</style>
</head>

let ITEMS=[],lang="fr",cat="all",sort="rec",cats=[];

  return ITEMS.filter(i=>{
    if(a&&!inStock(i))return false;if(b&&!i.bon)return false;
    if(q&&!(title(i)+" "+desc(i)+" "+(i.cat||"")+" "+cname(i.cat)+" "+i.id).toLowerCase().includes(q))return false;

function sorted(l){

}

  $("c-list").innerHTML=L.map(({i,n})=>`<li><div><div class="ct">${esc(title(i))}</div><div class="cr">${esc(t.ref)} ${esc(i.id)} · ${money(i.xaf)} ${t.xaf}</div>
    <div class="qty"><button type="button" data-q="${esc(i.id)}" data-d="-1" aria-label="${esc(t.minus)}">&minus;</button><span>${n}</span><button type="button" data-q="${esc(i.id)}" data-d="1" aria-label="${esc(t.plus)}"${n>=maxq(i)?" disabled":""}>+</button></div></div>
    <div class="cp">${money(i.xaf*n)} ${t.xaf}</div><button type="button" class="rm" data-q="${esc(i.id)}" data-d="-99">${esc(t.rmv)}</button></li>`).join("");
  $("c-tl").textContent=t.sbt;$("c-tv").textContent=money(total())+" "+t.xaf;$("c-tn").textContent=t.subn;
  $("c-nl").textContent=t.nm;$("c-pl").textContent=t.tel;$("c-cl").textContent=t.city;$("c-payl").textContent=t.payl;
  const sel=(document.querySelector("#c-pay input:checked")||{}).value;
  $("c-pay").innerHTML=Object.keys(t.pay).map(k=>`<label class="pay"><input type="radio" name="pay" value="${k}"${k===sel?" checked":""}>${esc(t.pay[k])}</label>`).join("");
  payNote();$("c-submit").textContent=t.place;$("c-priv").textContent=t.priv;$("c-err").hidden=true;
  if(ORDER){$("c-d1").textContent=t.d1;$("c-on").textContent=ORDER.no;$("c-d2").textContent=t.d2;$("c-send-t").textContent=t.send;$("c-send").href=wa(ORDER.msg);$("c-back").textContent=t.back}
}
function payNote(){const t=T(),k=(document.querySelector("#c-pay input:checked")||{}).value,n=$("c-paynote");n.hidden=!k;n.textContent=k?t.pnote[k]:""}
function openCart(){renderCart();const d=$("cart");if(!d.open)d.showModal()}
function orderNo(){
  const d=new Date(),p=n=>String(n).padStart(2,"0"),al="23456789ABCDEFGHJKMNPQRSTUVWXYZ";
  let r;try{r=crypto.getRandomValues(new Uint8Array(4))}catch(e){r=[0,0,0,0].map(()=>Math.random()*256)}
  return "CMD-"+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+"-"+Array.from(r,x=>al[Math.floor(x)%al.length]).join("");
}
function buildMsg(no,name,tel,city,pay){
  const t=T(),m=t.m,L=lines(),fee=(pay==="om"||pay==="momo");
  return [m.hi,m.no+" : "+no,""].concat(L.map(({i,n})=>"- "+i.id+" : "+title(i)+" x"+n+" = "+money(i.xaf*n)+" "+t.xaf),
   ["",m.tot+" : "+money(total())+" "+t.xaf,m.pay+" : "+t.pay[pay]+(fee?" ("+m.fees+")":""),"",
   m.nm+" : "+name,m.tel+" : "+tel,city?m.city+" : "+city:"","",m.end]).filter((x,k,a)=>!(x===""&&a[k-1]==="")).join("\n");
}
$("cartb").addEventListener("click",openCart);
$("d-add").addEventListener("click",()=>{if(!cur)return;if(CART[cur.id]){shut();openCart();return}setQty(cur.id,1)});
$("c-close").addEventListener("click",()=>$("cart").close());
$("cart").addEventListener("click",e=>{if(e.target===$("cart"))$("cart").close()});
$("c-list").addEventListener("click",e=>{const b=e.target.closest("button[data-q]");if(b)setQty(b.dataset.q,(CART[b.dataset.q]||0)+Number(b.dataset.d))});
$("c-pay").addEventListener("change",payNote);
$("c-back").addEventListener("click",()=>{ORDER=null;renderCart()});
$("c-send").addEventListener("click",()=>{setTimeout(()=>{CART={};saveCart();badge();ORDER=null;try{$("cart").close()}catch(e){}if(cur)fill(cur)},400)});
$("c-form").addEventListener("submit",e=>{
  e.preventDefault();const t=T(),er=$("c-err");
  const name=$("c-name").value.replace(/\s+/g," ").trim(),tel=$("c-tel").value.replace(/[^\d+ ()-]/g,"").trim(),city=$("c-city").value.replace(/\s+/g," ").trim();
  const dg=tel.replace(/\D/g,""),pay=(document.querySelector("#c-pay input:checked")||{}).value;
  const bad=name.length<2?[t.eN,"c-name"]:(dg.length<8||dg.length>15)?[t.eT,"c-tel"]:!pay?[t.eP,"c-pay"]:null;
  if(bad){er.textContent=bad[0];er.hidden=false;const f=$(bad[1]);(f.focus?f:f.querySelector("input")).focus();return}
  if(!lines().length)return;
  const no=orderNo();ORDER={no,msg:buildMsg(no,name,tel,city,pay)};renderCart();
});
function start(data){
  if(!Array.isArray(data)||!data.length)return fail();
  ITEMS=data;cleanCart();badge();const n={};data.forEach(i=>{if(i.cat)n[i.cat]=(n[i.cat]||0)+1});
  cats=Object.keys(n).sort((a,b)=>n[b]-n[a]);paint();
  const id=location.hash.slice(1);if(/^OZ-\d+$/.test(id))openItem(id);
}
function fail(){const e=$("err");e.hidden=false;e.className="err";e.textContent=T().loaderr;paint()}
fetch("items.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(start).catch(fail);
</script>
</body>
</html>
